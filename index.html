<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatStudyAI</title>

<style>
body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#4F9CF9,#6BCB77);
margin:0;
padding:0;
color:#333;
}

.header{
text-align:center;
padding:20px;
background:white;
border-bottom:4px solid #FFD93D;
}

.logo{
font-size:32px;
font-weight:bold;
}

.tag{
color:#666;
}

.container{
padding:20px;
max-width:900px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:12px;
border:2px solid #eee;
font-size:16px;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.ask{background:#4F9CF9;color:white}
.quiz{background:#FFD93D}
.voice{background:#6BCB77;color:white}

.subjects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-top:20px;
}

.subject{
background:#f5f7ff;
padding:12px;
border-radius:12px;
text-align:center;
font-weight:bold;
}

.answer{
margin-top:20px;
padding:15px;
background:#f0fff4;
border-radius:12px;
}
  
#reader{display:none;position:fixed;inset:0;background:#f6f8fc;z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch}
.r-bar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:3px solid #FFD93D;z-index:2}
.r-bar button{flex:none;padding:10px 14px;font-size:15px;background:#eef2ff}
.r-bar #pageBtn{background:#4F9CF9;color:#fff}
.r-title{flex:1;text-align:center;font-weight:bold;font-size:14px}
.r-pages{max-width:800px;margin:0 auto;padding:12px}
.r-page{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px;padding:6px;scroll-margin-top:70px}
.r-page img{width:100%;display:block;border-radius:8px;min-height:200px}
.r-label{text-align:center;color:#888;font-size:13px;margin:6px 0}
#sorter{display:none;position:fixed;top:66px;right:10px;width:min(320px,92vw);max-height:70vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px;z-index:1001}
.s-go{display:flex;gap:8px;margin-bottom:12px}
.s-go input{flex:1;padding:10px;border:2px solid #eee;border-radius:10px;font-size:16px;min-width:0}
.s-go button{flex:none;padding:10px 16px;background:#6BCB77;color:#fff}
.s-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.s-grid button{flex:none;padding:10px 0;background:#eef2ff}
.s-grid button.on{background:#4F9CF9;color:#fff}
</style>
</head>

<body>

function voiceRead(){

e.results[0][0].transcript

function quiz(){

out.style.display='block'
out.innerHTML="Quiz:<br>1)2+3×4=?<br>2)Who is Neha?<br>3)What do noses do?"

function startVoice(){
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang='en-IN';

recognition.onresult=function(e){
document.getElementById('question').value=e.results[0][0].transcript;
}

recognition.start();
}
/* ===== TEXTBOOK READER ===== */
const READER_BOOKS = {
  1: { title: "Together We Can", prefix: "ch1-page", ext: "jpg", pages: 10 }
  // change pages to the real number of pages
};

let readerObs;

function openReader(num){
  const b = READER_BOOKS[num];
  if(!b){ alert("Textbook pages for this chapter are coming soon!"); return; }

  document.getElementById("rTitle").innerText = "Ch " + num + " — " + b.title;

  let pages = "", grid = "";
  for(let i = 1; i <= b.pages; i++){
    pages += `<div class="r-page" id="page-${i}">
      <img loading="lazy" src="${b.prefix}${i}.${b.ext}" alt="Page ${i}"
        onerror="this.alt='Page ${i} image not found'">
      <div class="r-label">Page ${i} of ${b.pages}</div></div>`;
    grid += `<button id="sb-${i}" onclick="goPage(${i})">${i}</button>`;
  }
  document.getElementById("rPages").innerHTML = pages;
  document.getElementById("sGrid").innerHTML = grid;

  const r = document.getElementById("reader");
  r.style.display = "block";
  r.scrollTop = 0;
  document.body.style.overflow = "hidden";
  toggleSorter(false);

  if(readerObs) readerObs.disconnect();
  readerObs = new IntersectionObserver(es => {
    es.forEach(e => {
      if(e.isIntersecting){
        const n = e.target.id.split("-")[1];
        document.querySelectorAll(".s-grid button").forEach(x => x.classList.remove("on"));
        document.getElementById("sb-" + n).classList.add("on");
        document.getElementById("pageBtn").innerText = "📄 " + n + "/" + b.pages;
      }
    });
  }, { root: r, rootMargin: "-40% 0px -50% 0px" });
  document.querySelectorAll(".r-page").forEach(p => readerObs.observe(p));
}

function closeReader(){
  document.getElementById("reader").style.display = "none";
  document.body.style.overflow = "";
}

function toggleSorter(show){
  const s = document.getElementById("sorter");
  s.style.display = (show === undefined ? s.style.display !== "block" : show) ? "block" : "none";
}

function goPage(n){
  const el = document.getElementById("page-" + n);
  if(el){ el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  toggleSorter(false);
}

function goInput(){
  const n = parseInt(document.getElementById("goInput").value);
  if(n) goPage(n);
}
